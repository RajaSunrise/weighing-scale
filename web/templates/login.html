<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - StoneWeigh</title>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { "primary": "#136dec", "background-dark": "#101822", "surface-dark": "#192433" },
                    fontFamily: { "display": ["Manrope", "sans-serif"] }
                }
            }
        }
    </script>
</head>
<body class="bg-background-dark font-display text-white h-screen flex items-center justify-center">

    <div class="w-full max-w-md p-8 bg-surface-dark rounded-2xl shadow-2xl border border-white/5">
        <div class="flex flex-col items-center mb-8">
            <div class="w-12 h-12 bg-primary rounded-xl flex items-center justify-center text-2xl font-bold mb-4">S</div>
            <h1 class="text-2xl font-bold">Selamat Datang</h1>
            <p class="text-gray-400">Silakan masuk untuk mengakses StoneWeigh</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <input type="hidden" name="_csrf" value="{{ .csrf_token }}">
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-2">Username</label>
                <input type="text" name="username" class="w-full bg-background-dark border border-white/10 rounded-lg px-4 py-3 focus:outline-none focus:border-primary transition-colors" placeholder="admin" required>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-400 mb-2">Password</label>
                <div class="relative">
                    <input type="password" id="passwordInput" name="password" class="w-full bg-background-dark border border-white/10 rounded-lg px-4 py-3 focus:outline-none focus:border-primary transition-colors" placeholder="••••••••" required>
                    <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5" id="eyeIcon">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 hidden" id="eyeSlashIcon">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                        </svg>
                    </button>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-400 mb-2">Kode Keamanan</label>
                <div class="flex gap-4 mb-2">
                    <img id="captcha-img" src="{{ .captchaB64 }}" alt="Captcha" class="h-12 rounded bg-white/5 cursor-pointer" onclick="refreshCaptcha()" title="Klik untuk ganti gambar">
                    <input type="hidden" id="captcha-id" name="captcha_id" value="{{ .captchaID }}">
                    <button type="button" onclick="refreshCaptcha()" class="text-xs text-primary hover:underline">Ganti Gambar</button>
                </div>
                <input type="text" name="captcha" class="w-full bg-background-dark border border-white/10 rounded-lg px-4 py-3 focus:outline-none focus:border-primary transition-colors" placeholder="Masukkan angka di atas" required>
            </div>

            <div id="error-msg" class="text-red-500 text-sm text-center hidden">Username atau Password salah</div>

            <button type="submit" class="w-full bg-primary hover:bg-blue-600 text-white font-bold py-3 rounded-lg transition-colors">
                Masuk
            </button>
        </form>
    </div>

    <script>
        async function refreshCaptcha() {
            try {
                const res = await fetch('/api/captcha');
                const data = await res.json();
                if (data.id && data.b64) {
                    document.getElementById('captcha-img').src = data.b64;
                    document.getElementById('captcha-id').value = data.id;
                }
            } catch (e) {
                console.error("Gagal refresh captcha", e);
            }
        }

        function togglePassword() {
            const input = document.getElementById('passwordInput');
            const eye = document.getElementById('eyeIcon');
            const slash = document.getElementById('eyeSlashIcon');

            if (input.type === 'password') {
                input.type = 'text';
                eye.classList.add('hidden');
                slash.classList.remove('hidden');
            } else {
                input.type = 'password';
                eye.classList.remove('hidden');
                slash.classList.add('hidden');
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);

            // Note: CSRF Middleware in Gin usually expects X-CSRF-TOKEN header or form field.
            // Since we are sending JSON, we must put it in the header if middleware requires it,
            // OR ensure middleware reads from body/query too.
            // 'utrack/gin-csrf' checks header 'X-CSRF-TOKEN' or form '_csrf'.
            // Since we send JSON, we should extract _csrf and send it as header.

            const data = Object.fromEntries(formData);
            const csrfToken = data._csrf;

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-TOKEN': csrfToken
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    window.location.href = result.redirect;
                } else {
                    const errorEl = document.getElementById('error-msg');
                    errorEl.innerText = result.error || 'Login gagal';
                    errorEl.classList.remove('hidden');
                    // Refresh captcha on failure to prevent reuse
                    refreshCaptcha();
                }
            } catch (err) {
                console.error(err);
                document.getElementById('error-msg').innerText = "Terjadi kesalahan sistem";
                document.getElementById('error-msg').classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
