services:
  app:
    build: .
    container_name: stoneweigh-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_DRIVER=sqlite
      - DB_NAME=stoneweigh.db
      - ENABLE_DEMO_SCALE=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./logs:/app/logs:z
      - ./data:/app/data:z
      - ./web/static/images:/app/web/static/images:z
      - ./models:/app/models:z
    user: "0:0"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.2'
          memory: 256M
    depends_on:
      - redis

  redis:
    image: redis:alpine
    container_name: stoneweigh-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 64M

volumes:
  redis_data:
