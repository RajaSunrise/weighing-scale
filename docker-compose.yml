services:
  app:
    build: .
    container_name: stoneweigh-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_DRIVER=postgres
      - DB_DSN=host=postgres user=postgres password=postgres dbname=stoneweigh port=5432 sslmode=disable
      - ENABLE_DEMO_SCALE=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./logs:/app/logs:z
      - ./data:/app/data:z
      - ./web/static/images:/app/web/static/images:z
      - ./models:/app/models:z
      # SECURITY: Do not run as root. Use a non-privileged UID/GID.
      # Running as root inside the container means any container escape gives
      # the attacker root on the host (especially without seccomp/apparmor).
    user: "1000:1000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.2'
          memory: 256M
    depends_on:
      - redis
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: stoneweigh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # SECURITY: Change this to a strong, randomly-generated password in production.
      # Example: openssl rand -hex 20
      POSTGRES_PASSWORD: CHANGE_ME_strong_db_password
      POSTGRES_DB: stoneweigh
    volumes:
      - postgres_data:/var/lib/postgresql/data
    shm_size: 512mb
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # SECURITY: Pinned to a specific major version to avoid unexpected breaking changes
    # and unpredictable security patch timelines from :latest.
    container_name: stoneweigh-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

volumes:
  redis_data:
  postgres_data:
